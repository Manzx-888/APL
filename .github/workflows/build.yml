name: Build AutoKlik Pro V88 Signed

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.9'
  SOURCE_ZIP: 'AutoKlikPro_V88_FINAL_FIX_RETRY25_MUSIC_STATS_SIGNED_BOUNDS_FIX.zip'

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '${{ env.JAVA_VERSION }}'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

          sdkmanager --version

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '${{ env.GRADLE_VERSION }}'
          cache-disabled: true

      - name: Locate AutoKlik Pro source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          if [[ -f "$SOURCE_ZIP" ]]; then
            ZIP="$SOURCE_ZIP"
          else
            mapfile -t candidates < <(
              find . \
                -maxdepth 5 \
                -type f \
                -name 'AutoKlikPro_V88_*.zip' \
                -not -path './.git/*' \
                | sort
            )

            if (( ${#candidates[@]} == 1 )); then
              ZIP="${candidates[0]}"
            fi
          fi

          if [[ -z "$ZIP" ]]; then
            echo "::error::Source ZIP tidak ditemukan: $SOURCE_ZIP"
            echo
            echo "ZIP yang tersedia:"
            find . \
              -maxdepth 5 \
              -type f \
              -name '*.zip' \
              -not -path './.git/*' \
              -print \
              | sort || true
            exit 1
          fi

          echo "Using source ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/autoklik-v88"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          unzip -q -o \
            "${{ steps.source.outputs.zip }}" \
            -d "$OUT"

          SETTINGS="$(
            find "$OUT" \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print \
              -quit
          )"

          if [[ -z "$SETTINGS" ]]; then
            echo "::error::settings.gradle/settings.gradle.kts tidak ditemukan."
            echo
            echo "Struktur ZIP:"
            find "$OUT" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "Project root:"
          echo "$PROJECT"

          if [[ ! -f "$PROJECT/build.gradle" ]] && \
             [[ ! -f "$PROJECT/build.gradle.kts" ]]; then
            echo "::error::build.gradle/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          if [[ ! -d "$PROJECT/app" ]]; then
            echo "::error::folder app tidak ditemukan."
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Create temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/autoklik-signing"

          rm -rf "$KEY_DIR"
          mkdir -p "$KEY_DIR"

          keytool -genkeypair \
            -v \
            -keystore "$KEY_DIR/release.keystore" \
            -storetype PKCS12 \
            -alias autoklik-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "autoklik-temp-pass" \
            -keypass "autoklik-temp-pass" \
            -dname "CN=AutoKlik Pro, OU=Manzx Digital, O=Manzx Digital, L=Indonesia, ST=West Java, C=ID"

          echo "AUTO_KS_PATH=$KEY_DIR/release.keystore" >> "$GITHUB_ENV"
          echo "AUTO_KS_PASSWORD=autoklik-temp-pass" >> "$GITHUB_ENV"
          echo "AUTO_KS_ALIAS=autoklik-release" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: ${{ steps.extract.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "BUILD AUTOKLIK PRO V88"
          echo "======================================"

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "Building release APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease \
            --console=plain

      - name: Locate generated APK
        id: apk
        working-directory: ${{ steps.extract.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              | sort
          )

          if (( ${#APKS[@]} == 0 )); then
            echo "::error::APK release tidak ditemukan."

            echo
            echo "Isi output:"
            find app/build/outputs \
              -maxdepth 8 \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          APK="${APKS[0]}"

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.extract.outputs.project }}/${{ steps.apk.outputs.apk }}"

          echo "Verifying:"
          echo "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify \
            --verbose \
            "$APK"

      - name: Check APK package
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.extract.outputs.project }}/${{ steps.apk.outputs.apk }}"

          echo "APK package information:"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging \
            "$APK" \
            | head -30

      - name: Copy final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="${{ steps.extract.outputs.project }}/${{ steps.apk.outputs.apk }}"

          cp \
            "$APK" \
            "release/AutoKlikPro-V88-FINAL-FIX-SIGNED.apk"

          echo
          echo "FINAL APK:"
          ls -lh \
            "release/AutoKlikPro-V88-FINAL-FIX-SIGNED.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoKlikPro-V88-FINAL-FIX-SIGNED
          path: release/AutoKlikPro-V88-FINAL-FIX-SIGNED.apk
          if-no-files-found: error
          retention-days: 14
