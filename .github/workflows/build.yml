name: Build AutoKlik Pro V88 Signed

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

# Upload ZIP ini ke root repository sebelum menjalankan workflow.
env:
  SOURCE_ZIP: AutoKlikPro_V88_LICENSE_UI_RETRY_MUSIC_FIX_FINAL.zip
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK tidak ditemukan pada runner."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                -quit 2>/dev/null || true
            )"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager tidak ditemukan."

            find "$SDK_ROOT" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print 2>/dev/null || true

            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"

          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK ready: $SDK_ROOT"

          "$SDKMANAGER" --version

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '${{ env.GRADLE_VERSION }}'
          cache-disabled: true

      - name: Locate source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          if [[ -f "$SOURCE_ZIP" ]]; then
            ZIP="$SOURCE_ZIP"
          else
            ZIP="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname 'AutoKlikPro_V88*.zip' \
                -print | sort | tail -n 1
            )"
          fi

          if [[ -z "$ZIP" || ! -f "$ZIP" ]]; then
            echo "::error::Source ZIP AutoKlik Pro V88 tidak ditemukan."

            echo "ZIP yang tersedia:"
            find . \
              -maxdepth 4 \
              -type f \
              -iname '*.zip' \
              -print | sort || true

            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

          echo "Source ZIP: $ZIP"

      - name: Extract source ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/autoklik-v88"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          unzip -q -o \
            "${{ steps.source.outputs.zip }}" \
            -d "$OUT"

          SETTINGS="$(
            find "$OUT" \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print \
              -quit
          )"

          if [[ -z "$SETTINGS" ]]; then
            echo "::error::settings.gradle tidak ditemukan di dalam ZIP."

            find "$OUT" \
              -maxdepth 7 \
              -type f \
              -print | sort

            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          echo "Project: $PROJECT"

      - name: Validate fixed source
        working-directory: ${{ steps.extract.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          LM="app/src/main/java/com/manzxdigital/autoklikpro/LicenseManager.java"
          AS="app/src/main/java/com/manzxdigital/autoklikpro/engine/AppState.java"
          PR="app/src/main/java/com/manzxdigital/autoklikpro/PendingRetryEngine.java"
          AU="app/src/main/java/com/manzxdigital/autoklikpro/AutomationAccessibilityService.java"
          MS="app/src/main/java/com/manzxdigital/autoklikpro/SpotifyMediaNotificationService.java"
          MA="app/src/main/java/com/manzxdigital/autoklikpro/MainActivity.java"
          NC="app/src/main/java/com/manzxdigital/autoklikpro/NeonChartView.java"

          for f in \
            "$LM" \
            "$AS" \
            "$PR" \
            "$AU" \
            "$MS" \
            "$MA" \
            "$NC" \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/layout/activity_license.xml
          do
            test -f "$f" || {
              echo "::error::File hilang: $f"
              exit 1
            }
          done

          grep -q 'PAYLOAD_SIZE = 22' "$LM"
          grep -q 'SIGNATURE_SIZE = 64' "$LM"
          grep -q 'decodeBase64Compat' "$LM"

          ! grep \
            -A12 \
            'private static String normalizeKey' \
            "$LM" | grep -q 'toUpperCase'

          grep -q 'persistent.getInt("success"' "$AS"
          grep -q 'getPersistent("success") + 1' "$AS"
          grep -q 'getPersistent("retry") + 1' "$AS"

          grep -q 'pendingAutoOpenTriggered' "$AU"
          grep -q 'isPendingScreen(root)' "$PR"
          grep -q '60x' "$PR"
          grep -q 'SPOTIFY' "$MS"

          grep -q 'applyLicenseInsets' "$MA"
          grep -q 'setSingleLine(true)' "$MA"
          grep -q 'formatAxis' "$NC"

          echo "Source validation: OK"

      - name: Make Gradle executable
        working-directory: ${{ steps.extract.outputs.project }}
        shell: bash
        run: |
          chmod +x gradlew 2>/dev/null || true

      - name: Build unsigned release APK
        working-directory: ${{ steps.extract.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Locate unsigned APK
        id: apk
        working-directory: ${{ steps.extract.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$APK"

          APK_ABS="$(realpath "$APK")"

          echo "apk=$APK_ABS" >> "$GITHUB_OUTPUT"

          echo "APK: $APK_ABS"

      - name: Generate temporary signing key
        shell: bash
        run: |
          set -euo pipefail

          KS="$RUNNER_TEMP/autoklik-release.jks"

          PASSWORD="$(
            python3 -c \
              'import secrets; print(secrets.token_urlsafe(32))'
          )"

          keytool -genkeypair -v \
            -keystore "$KS" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias autoklik-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname \
              'CN=AutoKlik Pro, OU=AutoKlik Pro, O=MANZX DIGITAL, C=ID'

          echo "KS=$KS" >> "$GITHUB_ENV"
          echo "KS_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          chmod 600 "$KS"

      - name: Zipalign and sign release APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          ALIGNED="$RUNNER_TEMP/autoklik-aligned.apk"

          FINAL="release/AutoKlikPro-V88-Signed-FIXED.apk"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -f \
            -p \
            4 \
            "${{ steps.apk.outputs.apk }}" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$KS_PASSWORD" \
            --key-pass "pass:$KS_PASSWORD" \
            --ks-key-alias autoklik-release \
            --out "$FINAL" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "$FINAL"

          echo "Signed APK: $FINAL"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoKlikPro-V88-Signed-FIXED
          path: release/AutoKlikPro-V88-Signed-FIXED.apk
          if-no-files-found: error
